global
    log stdout format raw local0 warning
    maxconn 65535
    tune.bufsize 65536
    tune.rcvbuf.client 65536
    tune.rcvbuf.server 65536

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  tcp-smart-accept
    option  tcp-smart-connect
    option  http-keep-alive
    default-server inter 5s fall 3 rise 2

    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout tunnel          1h
    timeout client-fin      30s
    timeout server-fin      30s

frontend cloudrun_ingress
    bind *:8080

    acl is_health path -i /health
    acl is_health_all path -i -m beg /health
    acl is_root path -i /

    http-request return status 200 content-type "text/plain" string "OK" if is_health
    http-request return status 200 content-type "text/plain" string "OK" if is_health_all
    http-request return status 200 content-type "text/html" file "/usr/local/etc/haproxy/index.html" if is_root

    use_backend bk_trojan_ws if { path /CxlvinTRWS }
    use_backend bk_trojan_hu if { path /CxlvinTRHU }
    use_backend bk_trojan_xh if { path /CxlvinTRXH }

    use_backend bk_vmess_ws if { path /CxlvinVMWS }
    use_backend bk_vmess_hu if { path /CxlvinVMHU }
    use_backend bk_vmess_xh if { path /CxlvinVMXH }

    use_backend bk_vless_ws if { path /CxlvinVlWS }
    use_backend bk_vless_hu if { path /CxlvinVlHU }
    use_backend bk_vless_xh if { path /CxlvinVlXH }

    use_backend bk_ss_ws if { path /CxlvinSSWS }
    use_backend bk_ss_hu if { path /CxlvinSSHU }
    use_backend bk_ss_xh if { path /CxlvinSSXH }

backend bk_trojan_ws
    server xray 127.0.0.1:10001 check
backend bk_trojan_hu
    server xray 127.0.0.1:11001 check
backend bk_trojan_xh
    server xray 127.0.0.1:10010 check

backend bk_vmess_ws
    server xray 127.0.0.1:10004 check
backend bk_vmess_hu
    server xray 127.0.0.1:11004 check
backend bk_vmess_xh
    server xray 127.0.0.1:10011 check

backend bk_vless_ws
    server xray 127.0.0.1:10002 check
backend bk_vless_hu
    server xray 127.0.0.1:11002 check
backend bk_vless_xh
    server xray 127.0.0.1:10009 check

backend bk_ss_ws
    server xray 127.0.0.1:10003 check
backend bk_ss_hu
    server xray 127.0.0.1:11003 check
backend bk_ss_xh
    server xray 127.0.0.1:10012 check
