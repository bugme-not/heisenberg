global
    log stdout format raw local0 warning
    maxconn 65535

    tune.bufsize 65536
    tune.rcvbuf.client 65536
    tune.rcvbuf.server 65536

defaults
    log global
    mode http

    option httplog
    option dontlognull

    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s

frontend cloudrun_ingress
    bind 0.0.0.0:8080

    mode http

    acl is_health path -i /health
    http-request return status 200 \
        content-type "text/plain; charset=utf-8" \
        string "OK" \
        if is_health

    acl is_root path -i /
    http-request return status 200 \
        content-type "text/html; charset=utf-8" \
        file "/usr/local/etc/haproxy/index.html" \
        if is_root

    use_backend bk_trojan_ws if { path -i /CxlvinTRWS }
    use_backend bk_trojan_hu if { path -i /CxlvinTRHU }
    use_backend bk_trojan_xh if { path -i /CxlvinTRXH }

    use_backend bk_vmess_ws if { path -i /CxlvinVMWS }
    use_backend bk_vmess_hu if { path -i /CxlvinVMHU }
    use_backend bk_vmess_xh if { path -i /CxlvinVMXH }

    use_backend bk_vless_ws if { path -i /CxlvinVlWS }
    use_backend bk_vless_hu if { path -i /CxlvinVlHU }
    use_backend bk_vless_xh if { path -i /CxlvinVlXH }

    use_backend bk_ss_ws if { path -i /CxlvinSSWS }
    use_backend bk_ss_hu if { path -i /CxlvinSSHU }
    use_backend bk_ss_xh if { path -i /CxlvinSSXH }

    default_backend bk_blackhole


backend bk_trojan_ws
    mode http
    server xray 127.0.0.1:10001

backend bk_trojan_hu
    mode http
    server xray 127.0.0.1:11001

backend bk_trojan_xh
    mode http
    server xray 127.0.0.1:10010


backend bk_vmess_ws
    mode http
    server xray 127.0.0.1:10004

backend bk_vmess_hu
    mode http
    server xray 127.0.0.1:11004

backend bk_vmess_xh
    mode http
    server xray 127.0.0.1:10011


backend bk_vless_ws
    mode http
    server xray 127.0.0.1:10002

backend bk_vless_hu
    mode http
    server xray 127.0.0.1:11002

backend bk_vless_xh
    mode http
    server xray 127.0.0.1:10009


backend bk_ss_ws
    mode http
    server xray 127.0.0.1:10003

backend bk_ss_hu
    mode http
    server xray 127.0.0.1:11003

backend bk_ss_xh
    mode http
    server xray 127.0.0.1:10012


backend bk_blackhole
    mode http
    http-request return status 200 \
        content-type "text/plain; charset=utf-8" \
        string "ok"
