[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xray]
command=/usr/bin/xray run -c /etc/xray/config.json
user=nobody
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=10
stdout_logfile=/var/log/supervisor/xray.log
stderr_logfile=/var/log/supervisor/xray.err.log

[program:nginx]
command=/usr/bin/openresty -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
startsecs=3
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
