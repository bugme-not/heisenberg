[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray.json
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/xray.log
stderr_logfile=/var/log/xray.err.log

[program:haproxy]
command=/usr/local/sbin/haproxy -f /usr/local/etc/haproxy/haproxy.cfg
autostart=true
autorestart=true
startretries=10
stdout_logfile=/var/log/haproxy.log
stderr_logfile=/var/log/haproxy.err.log
